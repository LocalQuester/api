name: Publish API image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          node-version: 22
      - name: Validate before publishing
        if: steps.dockerfile.outputs.exists == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - uses: docker/login-action@v3
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/localquester/api:latest
            ghcr.io/localquester/api:${{ github.sha }}
