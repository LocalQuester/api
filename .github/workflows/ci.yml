name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: localquester
          POSTGRES_PASSWORD: localquester
          POSTGRES_DB: localquester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localquester -d localquester"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://localquester:localquester@localhost:5432/localquester
    steps:
      - uses: actions/checkout@v4
      - name: Validate issue-linked branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [[ ! "$GITHUB_HEAD_REF" =~ ^(feat|fix|chore|docs|refactor|test|ci)/([0-9]+)-[a-z0-9-]+$ ]]; then
            echo "Branch must be type/issue-number-description" >&2
            exit 1
          fi
          issue="${BASH_REMATCH[2]}"
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          if ! grep -Eiq "(closes|fixes|resolves) #${issue}([^0-9]|$)" <<< "$body"; then
            echo "PR body must contain Closes #${issue}" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate API
        run: |
          if [ ! -f package.json ]; then
            echo "API code has not been added yet"
            exit 0
          fi
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run db:check
          npm run db:migrate
          npm run db:verify
