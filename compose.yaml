name: localquester-api

services:
  postgres:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_USER: localquester
      POSTGRES_PASSWORD: localquester
      POSTGRES_DB: localquester
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U localquester -d localquester"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
